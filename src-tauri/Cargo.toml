[package]
name = "tub-struct"
version = "0.1.0"
description = "TubStruct — tubulões curtos — OpenStruct"
authors = ["Ricardo Corsini · OpenStruct"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
